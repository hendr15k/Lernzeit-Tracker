name: Validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in $(git ls-files '*.js'); do
            node --check "$f"
          done
      - name: Rebuild utility CSS and fail on drift
        run: |
          npm run build:css
          git diff --exit-code -- css/tailwind.generated.css
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: UI tests
        run: npm test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t lernzeit-tracker:ci .
      - name: Boot and probe
        run: |
          docker run -d --name lernzeit-ci -p 18085:80 lernzeit-tracker:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18085/healthz | grep -q ok; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18085/ | grep -q "Lernzeit Tracker"
          curl -fsS http://127.0.0.1:18085/css/tailwind.generated.css >/dev/null
          docker stop lernzeit-ci
