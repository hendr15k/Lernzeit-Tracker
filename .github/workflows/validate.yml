name: Validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          set -e
          for f in $(git ls-files '*.js'); do
            node --check "$f"
          done
      - name: Rebuild utility CSS and fail on drift
        run: |
          npm run build:css
          git diff --exit-code -- css/tailwind.generated.css
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: UI tests
        run: npm test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t lernzeit-tracker:ci .
          docker build -t lernzeit-api:ci --target api .
      - name: Boot and probe
        run: |
          docker network create lz-ci
          docker run -d --name api --network lz-ci \
            -e AUTH_USER=hendrik \
            -e AUTH_PASSWORD=test-password \
            -e AUTH_SECRET=test-secret-0123456789abcdef0123456789 \
            -e DATA_DIR=/data \
            lernzeit-api:ci
          docker run -d --name app --network lz-ci -p 18085:80 lernzeit-tracker:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18085/healthz | grep -q ok; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18085/ | grep -q "Lernzeit Tracker"
          curl -fsS http://127.0.0.1:18085/css/tailwind.generated.css >/dev/null
          curl -fsS http://127.0.0.1:18085/api/health | grep -q ok
          curl -fsS -c /tmp/ci-cookies.txt -H 'Content-Type: application/json' \
            -H 'Origin: http://127.0.0.1:18085' \
            -d '{"username":"hendrik","password":"test-password"}' \
            http://127.0.0.1:18085/api/login | grep -q hendrik
          curl -fsS -b /tmp/ci-cookies.txt http://127.0.0.1:18085/api/me | grep -q hendrik
          docker stop app api
